<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Vibrant Premium Gradient (Coral Red to Warm Orange) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A5F" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Clean Pure White Background -->
  <circle cx="60" cy="60" r="56" fill="#FFFFFF" stroke="url(#primaryGrad)" stroke-width="4" />

  <!-- Inner border ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#primaryGrad)" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Monogram T & R (Minimalist, Abstract Geometric) -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <!-- Letter T (Left Stem and Bar) -->
    <path d="M35,38 L73,38 M54,38 L54,80" fill="none" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letter R (Right Side Intersecting) -->
    <path d="M54,52 L68,52 C73,52 77,56 77,61 C77,66 73,70 68,70 L54,70 M67,70 L77,83" fill="none" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Small star accent for "Review" -->
    <polygon points="84,33 86,39 92,39 87,43 89,49 84,45 79,49 81,43 76,39 82,39" fill="url(#primaryGrad)" />
  </g>
</svg>
