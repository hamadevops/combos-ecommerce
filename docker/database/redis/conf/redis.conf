# Redis Production Configuration Template
# Optimized for caching and durability

# Networking
# In network host mode, Redis shares the host network.
# 127.0.0.1 restricts access to local connections (safest if apps are on the same host).
# Uncomment 0.0.0.0 to allow connections from other machines (ensure firewall blocks port 6379).
bind 127.0.0.1
protected-mode yes

# General Configuration
daemonize no
loglevel notice
logfile /var/log/redis/redis-server.log

# Persistence settings
# RDB snapshots (backups on transition thresholds)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# AOF Persistence (durability on every write/update, crucial for production databases)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
# Adjust maxmemory according to your host size.
maxmemory 512mb
# Keep caching fast by removing least recently used keys when memory is full
maxmemory-policy allkeys-lru
