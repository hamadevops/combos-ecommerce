version: '3.8'

services:
    backend:
        image: 127.0.0.1:8888/library/backend:latest
        container_name: backend-app
        restart: unless-stopped
        ports:
            - "${BACKEND_PORT}:3333"
        env_file:
            - .env
        networks:
            - app-network

    storefront:
        image: 127.0.0.1:8888/library/storefront:latest
        container_name: storefront-app
        restart: unless-stopped
        ports:
            - "${STOREFRONT_PORT}:3000"
        env_file:
            - .env
        environment:
            - PORT=3000
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        depends_on:
            - backend
        networks:
            - app-network

    admin-cms:
        image: 127.0.0.1:8888/library/admin-cms:latest
        container_name: admin-cms-app
        restart: unless-stopped
        ports:
            - "${ADMIN_CMS_PORT}:80"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        depends_on:
            - backend
        networks:
            - app-network

networks:
    app-network:
        name: vibe-app-network
        external: true
