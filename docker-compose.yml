version: '3.8'

services:
    db-mysql:
        image: mysql:8.0
        container_name: mysql-container
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD_ROOT}
            MYSQL_DATABASE: ${DB_NAME}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        ports:
            - "${DB_PORT}:3306"
        volumes:
            - ./apps/backend/data/mysql:/var/lib/mysql
        networks:
            - app-network

    db-redis:
        image: redis:7.0
        container_name: redis-container
        command: "redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes"
        restart: unless-stopped
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        ports:
            - "${REDIS_PORT}:6379"
        volumes:
            - ./apps/backend/data/redis:/data
        networks:
            - app-network

    db-phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin-container
        restart: unless-stopped
        environment:
            PMA_HOST: mysql-container
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD_ROOT}
            UPLOAD_LIMIT: 2G
        ports:
            - "${PHP_ADMIN_PORT}:80"
        networks:
            - app-network

    db-minio:
        image: tahuuhao/minio:latest
        container_name: minio
        ports:
            - "${MINIO_API_PORT}:9000"
            - "${MINIO_WEB_PORT}:9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        volumes:
            - ./apps/backend/data/minio:/data
        command: server --console-address ":9001" /data
        restart: unless-stopped
        networks:
            - app-network

    db-cloudflared:
        image: cloudflare/cloudflared:latest
        command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
        restart: unless-stopped
        env_file:
            - .env
        networks:
            - app-network

    backend:
        image: 127.0.0.1:8888/library/backend:latest
        container_name: backend-app
        restart: unless-stopped
        ports:
            - "${BACKEND_PORT}:3333"
        env_file:
            - .env
        depends_on:
            - db-mysql
            - db-redis
            - db-minio
        networks:
            - app-network

    storefront:
        image: 127.0.0.1:8888/library/storefront:latest
        container_name: storefront-app
        restart: unless-stopped
        ports:
            - "${STOREFRONT_PORT}:3000"
        env_file:
            - .env
        depends_on:
            - backend
        networks:
            - app-network

    admin-cms:
        image: 127.0.0.1:8888/library/admin-cms:latest
        container_name: admin-cms-app
        restart: unless-stopped
        ports:
            - "${ADMIN_CMS_PORT}:80"
        depends_on:
            - backend
        networks:
            - app-network

networks:
    app-network:
        driver: bridge
